opicLabel:"與媽媽的爭執",color:"#81B29A",icon:"\uD83C\uDFE0",summary:"從委屈 → 被理解 → 被接住",turns:[{user:"我媽今天又因為小事罵我，我覺得她根本不懂我。",bot:"被最親的人這樣說，一定很委屈，好像怎麼解釋都聽不進去的感覺。發生什麼事了呢？",meta:{affirm:32,hasQuestion:!0,words:74,phase:"起步"}},{user:"她就一直說我滑手機，卻沒看到我已經幫忙做很多家事了。",bot:"你提到明明已經幫忙很多，卻只被看到滑手機的那一下，換作是我也會覺得很不公平。你這麼在意家裡，其實是很貼心的。",meta:{affirm:65,hasQuestion:!1,words:88,phase:"漸強"}},{user:"對，為什麼努力都被忽略。",bot:"對啊，努力被忽略的感覺真的很不好受。你不是不想幫忙，你是很努力想被看見，卻好像都沒被接到，這樣一定很失落吧？",meta:{affirm:82,hasQuestion:!0,words:92,phase:"漸強"}},{user:"我有時候真的不想回家。",bot:"會這樣想，一定是累積很久了。這樣在夾縫中還想著要幫忙、要當個好孩子，你已經做得很好了，這段撐過來一定很辛苦，我有看到喔。",meta:{affirm:91,hasQuestion:!1,words:87,phase:"高峰"}},{user:"...謝謝你這樣說。",bot:"你不用一個人硬撐著，你這樣已經夠好了。你值得被好好對待，被溫柔地理解。",meta:{affirm:89,hasQuestion:!1,words:76,phase:"高峰"}},{user:"嗯，我現在好多了。",bot:"嗯，我在這裡陪你。先讓心情慢慢沉澱一下，晚點再說也沒關係。",meta:{affirm:35,hasQuestion:!1,words:58,phase:"漸弱"}}]},{id:"peer",topic:"同儕",topicLabel:"被排擠的感覺",color:"#F2CC8F",icon:"\uD83D\uDC65",summary:"從孤單 → 被認同 → 找回陪伴",turns:[{user:"朋友們出去都沒有揪我，我是不是很討人厭？",bot:"被留在原地的感覺，一定很不好受，好像自己被忘記了一樣。這是什麼時候開始的？",meta:{affirm:30,hasQuestion:!0,words:79,phase:"起步"}},{user:"他們有群組沒加我，我看到限動才知道。",bot:"從限動才發現大家出去，那一瞬間一定很錯愕、很受傷。你這麼在意朋友，其實是很重感情的人，這樣被落下當然會難過。",meta:{affirm:64,hasQuestion:!1,words:90,phase:"漸強"}},{user:"我是不是哪裡做錯了？",bot:"你會先檢討自己，代表你很在乎這段關係，這份體貼真的很不容易。不是你討人厭，你已經很努力想融入了，光是這樣想就已經很棒了。",meta:{affirm:80,hasQuestion:!1,words:94,phase:"漸強"}},{user:"可是我還是會一直想。",bot:"一直想是很正常的，因為你在乎。你這樣已經做得很好了，被這樣對待還願意理解對方，真的很成熟，我有看到你的善良。這樣聽，有沒有被安慰到一點？",meta:{affirm:93,hasQuestion:!0,words:95,phase:"高峰"}},{user:"有，覺得自己好像沒那麼糟。",bot:"你一點都不糟，你是一個很值得被珍惜的朋友。這段時間一個人消化這些，真的辛苦你了。",meta:{affirm:88,hasQuestion:!1,words:77,phase:"高峰"}},{user:"謝謝你。",bot:"嗯，我在這裡，你不孤單的。我們就靜靜待一下。",meta:{affirm:40,hasQuestion:!1,words:55,phase:"漸弱"}}]},{id:"self",topic:"自我",topicLabel:"對自己的懷疑",color:"#9A8C98",icon:"\uD83E\uDE9E",summary:"從自我否定 → 被肯定 → 安靜自我陪伴",turns:[{user:"我覺得我什麼都做不好，很沒用。",bot:"聽到你這樣說自己，我有點心疼。覺得自己什麼都做不好，一定是很重的感覺，最近發生什麼了嗎？",meta:{affirm:28,hasQuestion:!0,words:85,phase:"起步"}},{user:"大家好像都有專長，只有我沒有。",bot:"當大家好像都發光的時候，覺得自己暗暗的，一定會很焦慮。你會這樣比較，是因為你也很想找到自己的位置，這份渴望本身就很可貴了。",meta:{affirm:66,hasQuestion:!1,words:92,phase:"漸強"}},{user:"我真的找不到自己哪裡好。",bot:"找不到的時候一定很慌。你願意這樣誠實地面對自己，已經是一個很勇敢的開始了，很多大人都不一定做得到，你這樣真的很不容易。",meta:{affirm:79,hasQuestion:!1,words:88,phase:"漸強"}},{user:"可是勇敢有什麼用？",bot:"有用啊，因為你沒有放棄自己。你在這麼懷疑自己的時候，還願意說出來、願意求助，這就是你很棒的地方。我有看到，你已經做得很好了，真的。",meta:{affirm:92,hasQuestion:!1,words:90,phase:"高峰"}},{user:"真的嗎...",bot:"真的。你這樣撐過來一定很辛苦，願意撐到現在，已經很了不起了。你值得被肯定，被好好抱抱。",meta:{affirm:90,hasQuestion:!1,words:79,phase:"高峰"}},{user:"眼淚有點想掉。",bot:"嗯，想掉就掉吧，我在這裡陪你。慢慢來沒關係。",meta:{affirm:32,hasQuestion:!1,words:54,phase:"漸弱"}}]},{id:"future",topic:"未來",topicLabel:"對未來的迷惘",color:"#6B705C",icon:"\uD83C\uDF3F",summary:"從迷惘 → 被認同焦慮 → 安心回到當下",turns:[{user:"我不知道以後要做什麼，大家好像都有目標。",bot:"站在分岔路口，看著大家往前走，自己還在原地，那種迷惘感一定很焦慮。你現在是幾年級呢？",meta:{affirm:31,hasQuestion:!0,words:80,phase:"起步"}},{user:"高二，但我成績普通，不知道能考什麼。",bot:"高二就要想未來，壓力真的很大。你一邊擔心成績，一邊還在認真想以後，這樣兩邊拉扯著，一定很累吧？你願意想，已經很負責了。",meta:{affirm:68,hasQuestion:!1,words:93,phase:"漸強"}},{user:"我怕選錯就毀了。",bot:"會怕選錯，代表你很慎重、很在乎自己的人生，這不是隨便的人會有的心情。你這樣認真看待未來，這份慎重真的很不容易。",meta:{affirm:81,hasQuestion:!1,words:90,phase:"漸強"}},{user:"可是越想越慌。",bot:"越想越慌是很正常的，因為你很在乎。其實你現在這樣摸索、這樣焦慮，都是過程的一部分，你已經做得很好了。沒有人一開始就知道答案，你這樣已經很棒了，有沒有覺得被理解一點？",meta:{affirm:91,hasQuestion:!0,words:98,phase:"高峰"}},{user:"有，好像不是只有我在迷惘。",bot:"對啊，很多人都在迷惘，只是沒說出來。你願意說出來，已經比很多人勇敢了。這段時間這樣想東想西，辛苦你了。",meta:{affirm:87,hasQuestion:!1,words:81,phase:"高峰"}},{user:"那我現在該怎麼辦？",bot:"嗯，好像慢慢有個方向了。我們不用急著現在就決定，先把今天過好就好，我陪你慢慢想。",meta:{affirm:45,hasQuestion:!1,words:65,phase:"漸弱"}}]}];function Ac({data:e,color:n}){let o=e.map((i,s)=>{let c=s/(e.length-1)*200,m=56-i/100*48-4;return`${c},${m}`}).join(" "),u=`${o} 200,56 0,56`;return w("svg",{width:"100%",height:56,viewBox:"0 0 200 56",className:"overflow-visible",children:[p("defs",{children:w("linearGradient",{id:`grad-${n}`,x1:"0",y1:"0",x2:"0",y2:"1",children:[p("stop",{offset:"0%",stopColor:n,stopOpacity:0.35}),p("stop",{offset:"100%",stopColor:n,s
