<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>會客室 - 本機可紀錄模式 V1.6</title>
<style>:root{--ink:#102c52;--green:#6e998d;--coral:#ee735c;--soft:#f7faf9;--blush:#fff2ee;--line:#e8eeec}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans TC",sans-serif;background:var(--soft);color:var(--ink);line-height:1.7;padding:24px;max-width:880px;margin:0 auto}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;font-size:11px;margin-right:5px}
.badge.g{background:var(--green)}.badge.c{background:var(--coral)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.btn{border:none;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600}
.btn-p{background:var(--green);color:#fff}.btn-g{background:#fff;border:1px solid var(--line)}
.record{border-left:4px solid var(--green)}.meta{font-size:11px;color:#7a8a95}.detail{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}.detail.open{display:block}
</style></head><body>
  <!-- 頂部 HAIC 整合導覽列 -->
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 16px; background: white; border: 1px solid #d8e0e6; border-radius: 12px; font-size: 0.85rem;">
    <div style="font-weight: 700; color: #102c52; display: flex; align-items: center; gap: 6px;">
      <span>❧</span>
      <span>少年仔安啦會客室 · 本機紀錄模式 V1.6</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="./index.html" style="color: #53657a; text-decoration: none; font-weight: 500;">← 回會客室首頁</a>
      <span style="color: #cbd5e1;">|</span>
      <a href="../index.html" style="color: #6e998d; text-decoration: none; font-weight: 600;">⌂ 回 HAIC 總站</a>
      <span style="color: #cbd5e1;">|</span>
      <a href="../cowork/index.html" style="color: #53657a; text-decoration: none; font-weight: 500;">📋 協同看板</a>
    </div>
  </div>

<h1>會客室 - 本機可紀錄模式 V1.6 漸強漸弱版</h1><div style="color:#6e998d;font-size:13px;margin-bottom:12px"><span class="badge g">離線可用</span><span class="badge">無需額度</span><span class="badge c">台北-南投共用</span> 紀錄工具不是負擔</div>
<div class="card" style="background:var(--blush)">V1.6 漸強漸弱：肯定30%→90%→20%，問句少時仍有安慰效果，單檔離線，本機運作，路徑 H:\HAIC_入口\HAIC\welfare-workspace\</div>
<div class="card"><b>⚡ 30秒快速記錄</b><br><input id="f1" placeholder="① 發現什麼？必填"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="f2" placeholder="② 現在版本？必填"><input id="f3" placeholder="③ 想怎麼改善？選填"></div><div style="margin-top:10px"><button class="btn btn-p" onclick="add()">＋ 一鍵記錄到本機</button><button class="btn btn-g" onclick="exp()">匯出JSON</button><button class="btn btn-g" onclick="exp2()">匯出CSV</button><button class="btn btn-g" onclick="window.open('https://docs.google.com/spreadsheets/d/1SZC18XAx7eC6VkdUmAPf8iRCS87Sar8xRDvLxmaL4-c/edit','_blank')">共用Sheet版</button></div></div><div id="list"></div>
<script>const K='welfare_local_v1_6';let R=JSON.parse(localStorage.getItem(K)||'[]');if(R.length==0){R=[{id:1,t:new Date().toLocaleString(),f:'問句一直遞減少了被肯定感',v:'V1.4',i:'改為85%→15%遞減',s:'已產出版'},{id:2,t:new Date().toLocaleString(),f:'問句少時回應量也少沒有安慰效果',v:'V1.6',i:'改為漸強漸弱 肯定30%→90%→20%',s:'已裁定'}]}function save(){localStorage.setItem(K,JSON.stringify(R));render()}function add(){let f=document.getElementById('f1').value.trim(),v=document.getElementById('f2').value.trim(),i=document.getElementById('f3').value.trim();if(!f||!v){alert('填發現+版本');return}R.unshift({id:Date.now(),t:new Date().toLocaleString(),f,v,i,s:'待改善'});document.getElementById('f1').value='';document.getElementById('f2').value='';document.getElementById('f3').value='';save()}function render(){let L=document.getElementById('list');L.innerHTML='';R.forEach(r=>{let d=document.createElement('div');d.className='card record';d.innerHTML=`<div class=meta>${r.t} · ${r.v} · ${r.s}</div><b>${r.f}</b><div style=font-size:12px>${r.i||''}</div><div style=margin-top:6px><button class="btn btn-g" onclick="this.parentElement.nextElementSibling.classList.toggle('open')">展開6步驟</button><button class="btn btn-g" onclick="R=R.filter(x=>x.id!=${r.id});save()">刪除</button></div><div class=detail><div>現況檢核：<input value="${r.f}" onchange="R.find(x=>x.id==${r.id}).f=this.value;save()"></div><div>預定改善：<input value="${r.i||''}" onchange="R.find(x=>x.id==${r.id}).i=this.value;save()"></div><div>版本產出：<input value="${r.v}" onchange="R.find(x=>x.id==${r.id}).v=this.value;save()"></div><div>研究資料：此筆可提取作為研究資料，未來可採用，雙重用途</div></div>`;L.appendChild(d)})}function exp(){let b=new Blob([JSON.stringify(R,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='welfare_V1.6_'+Date.now()+'.json';a.click()}function exp2(){let h='時間,發現,版本,改善,狀態\n';R.forEach(r=>{h+=`"${r.t}","${r.f}","${r.v}","${r.i||''}","${r.s}"\n`});let b=new Blob([h],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='welfare_V1.6_'+Date.now()+'.csv';a.click()}render()</script></body></html>
